<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — PawPal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <nav class="nav container">
      <div class="logo">PAWPAL</div>
      <a href="index.html" class="nav-btn">Back to shop</a>
    </nav>
  </header>

  <section class="section auth-page">
    <div class="container">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Create your account</h2>
          <p>Join PawPal and keep your dog happy while you're away</p>
        </div>
        <form id="signup-form" class="auth-form">
          <div class="form-group">
            <label>Full name</label>
            <input type="text" name="name" required placeholder="Your name">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary btn-full">Create account</button>
        </form>
        <p id="signup-msg" class="form-msg"></p>
        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="logo">PAWPAL</div>
      <p>Smart dog toy & feeder. Keep your dog happy, fed and hydrated while you're away.</p>
      <div class="footer-note">Demo project — data stored on our demo server.</div>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>
</html>
